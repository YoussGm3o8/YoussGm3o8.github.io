# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Youssef El Kesti | Computer Engineering Student"
email: "elkestiyoussef@gmail.com"
description: "Computer Engineering student at McGill University, specializing in embedded systems and software development"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://YoussGm3o8.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Theme settings
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"

# Site Author
author:
  name: "Youssef El Kesti"
  avatar: "/assets/images/profile.jpg"
  bio: "Computer Engineering Student | McGill University"
  location: "Canada"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YoussGm3o8"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:elkestiyoussef@gmail.com"
    - label: "Phone"
      icon: "fas fa-fw fa-phone"
      url: "tel:+14385266514"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YoussGm3o8"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/youssef-el-kesti-308/"

# Build settings
theme: minimal-mistakes-jekyll

# Social Media Links
social:
  - label: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/YoussGm3o8"
  - label: "LinkedIn"
    icon: "fab fa-linkedin"
    url: "https://www.linkedin.com/in/youssef-el-kesti-308/"

plugins:
  - jekyll-feed
  
# Navigation Links
navigation:
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Blog"
    url: "/blog/"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      classes: scroll-page
      wide: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: scroll-page
      wide: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
